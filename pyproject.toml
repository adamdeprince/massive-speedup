[project]
name = "massive-speedup"
version = "0.1.1"
description = "Nanobind/C++ parsers for polygon, bulk S3, and websocket market data."
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Adam" }
]
keywords = [
  "nanobind",
  "polygon",
  "s3",
  "websocket",
  "market-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["tqdm (>=4.67.3,<5.0.0)", "scikit-build-core (>=0.12.2,<0.13.0)", "nanobind (>=2.12.0,<3.0.0)"]

[project.scripts]
massive-speedup-build-database = "massive_speedup.build_database:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "mypy>=1.14.0,<2.0.0",
  "nanobind>=2.4.0",
  "ruff>=0.8.0,<1.0.0",
  "scikit-build-core>=0.10.0",
]

[build-system]
requires = [
  "scikit-build-core>=0.10.0",
  "nanobind>=2.4.0",
]
build-backend = "scikit_build_core.build"

[tool.poetry]
packages = [{ include = "massive_speedup", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
mypy = ">=1.14.0,<2.0.0"
nanobind = ">=2.4.0"
ruff = ">=0.8.0,<1.0.0"
scikit-build-core = ">=0.10.0"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
install.components = ["massive_speedup_Runtime"]
wheel.packages = ["src/massive_speedup"]

[tool.cibuildwheel]
build-frontend = "build"
config-settings = { "build-dir" = "/tmp/massive-speedup-cibuildwheel/{wheel_tag}" }
enable = ["cpython-freethreading"]
test-command = "python -m pytest {project}/tests"
test-requires = ["pytest>=8.3.0,<9.0.0"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
build = """
cp39-manylinux_x86_64 cp39-musllinux_x86_64
cp310-manylinux_x86_64 cp310-musllinux_x86_64
cp311-manylinux_x86_64 cp311-musllinux_x86_64
cp312-manylinux_x86_64 cp312-musllinux_x86_64
cp313-manylinux_x86_64 cp313-musllinux_x86_64
cp313t-manylinux_x86_64 cp313t-musllinux_x86_64
cp314-manylinux_x86_64 cp314-musllinux_x86_64
cp314t-manylinux_x86_64 cp314t-musllinux_x86_64
"""
manylinux-x86_64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
