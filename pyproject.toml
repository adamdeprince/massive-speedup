[project]
name = "massive-speedup"
version = "0.1.0"
description = "SIMD-oriented parsers for polygon, bulk S3, and websocket market data."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "Apache-2.0"
authors = [
  { name = "Adam" }
]
keywords = [
  "simd",
  "nanobind",
  "polygon",
  "s3",
  "websocket",
  "market-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["tqdm (>=4.67.3,<5.0.0)"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "mypy>=1.14.0,<2.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[build-system]
requires = [
  "scikit-build-core>=0.10.0",
  "nanobind>=2.4.0",
]
build-backend = "scikit_build_core.build"

[tool.poetry]
packages = [{ include = "massive_speedup", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
mypy = ">=1.14.0,<2.0.0"
ruff = ">=0.8.0,<1.0.0"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/massive_speedup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
